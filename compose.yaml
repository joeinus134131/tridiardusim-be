services:
  api:
    build:
      context: .
    container_name: tridiardusim-api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      PROJECT_DIR: /app/data/projects
      ARDUINO_CLI_PATH: /usr/local/bin/arduino-cli
      ALLOWED_ORIGINS: https://idnmakerspace.com,https://www.idnmakerspace.com,https://simulate.idnmakerspace.com,http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - project_data:/app/data/projects
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  project_data:

networks:
  proxy:
    external: true
    name: n8n_default
